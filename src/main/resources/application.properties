spring.application.name=educhain-backend

# ==========================================
# PostgreSQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:postgresql://localhost:5432/educhain
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate Configuration
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Server Configuration
# ==========================================

server.port=8080

# ==========================================
# Blockchain / Web3j Configuration
# ==========================================

blockchain.rpc-url=http://127.0.0.1:8545

blockchain.private-key=${BLOCKCHAIN_PRIVATE_KEY}

blockchain.contract-address=0x5FbDB2315678afecb367f032d93F642f64180aa3

blockchain.gas-limit=3000000

blockchain.gas-price=1000000000